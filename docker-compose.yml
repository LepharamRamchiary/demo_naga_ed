services:
  db:
    image: mysql:8.4
    container_name: nagaed_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No "ports:" here on purpose — MySQL is only reachable by other
    # containers on app-network, never exposed to the host/public internet.

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nagaed_server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Not published to the host — the client's nginx proxies to it internally.
    # Uncomment below temporarily if you want to hit it directly for debugging:
    # ports:
    #   - "5000:5000"

  fast_api:
    build:
      context: ./fast_api
      dockerfile: Dockerfile
    container_name: nagaed_fastapi
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Not published to the host — the client's nginx proxies to it internally.
    # Uncomment below temporarily if you want to hit /docs directly:
    # ports:
    #   - "8000:8000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_AI_API_URL: /ai
    container_name: nagaed_client
    restart: unless-stopped
    depends_on:
      - server
      - fast_api
    ports:
      - "8080:8080"   # only the frontend is exposed publicly
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: